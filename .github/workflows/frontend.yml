name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "modules/**/frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "modules/**/frontend/**"

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # modules 的前端代码通过路径别名引用 frontend/node_modules
      - name: Link node_modules for modules
        run: ln -s $GITHUB_WORKSPACE/frontend/node_modules $GITHUB_WORKSPACE/node_modules

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
