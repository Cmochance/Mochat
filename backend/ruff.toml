target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long - 由 formatter 处理
    "UP006", # Use `dict` instead of `Dict` - 存量代码暂不强制
    "UP035", # Use `list`/`dict` instead of `List`/`Dict` in typing - 存量代码暂不强制
    "UP007", # Use X | Y instead of Union[X, Y] - 存量代码暂不强制
    "UP045", # Use `X | None` instead of `Optional[X]` - 存量代码暂不强制
]

[lint.isort]
known-first-party = ["app"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
