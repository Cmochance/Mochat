# PostgreSQL 生产配置示例
# 用法: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
#
# 在 .env 中设置:
#   DATABASE_URL=postgresql+asyncpg://mochat:YOUR_PASSWORD@db:5432/mochat
#   POSTGRES_PASSWORD=YOUR_SECURE_PASSWORD

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mochat
      POSTGRES_USER: mochat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mochat"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://mochat:${POSTGRES_PASSWORD}@db:5432/mochat}

volumes:
  pg_data:
