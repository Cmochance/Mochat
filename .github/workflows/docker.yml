name: Docker Build

on:
  pull_request:
    # 不限 paths，确保 build-modules required check 始终报告状态
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "modules/**"
      - "docker-compose.yml"
      - "**/Dockerfile"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: mochat/frontend:ci

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: mochat/backend:ci

  build-module:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - upword
          - uppic
          - upgrade
          - picgenerate
          - pptgen
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: modules/${{ matrix.module }}/backend
          file: modules/${{ matrix.module }}/backend/Dockerfile
          push: false
          tags: mochat/${{ matrix.module }}:ci

  # 聚合 job，确保 required check "build-modules" 始终报告
  build-modules:
    if: always()
    needs: [build-module]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.build-module.result }}" = "failure" ]; then
            echo "Module builds failed"
            exit 1
          fi
          echo "All module builds passed (or skipped)"
